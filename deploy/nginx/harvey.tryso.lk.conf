# Harvey dashboard (Sri Lanka) at https://harvey.tryso.lk — install to
# /www/server/panel/vhost/nginx/harvey.tryso.lk.conf. An exact server_name wins over
# the *.tryso.lk wildcard in tryso.lk.conf, so this doesn't touch the stores.
#
# The dashboard has no login of its own and can edit .env and send email,
# so everything is behind HTTP basic auth. The password file starts empty
# (nobody can log in) until you add a user — see deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name harvey.tryso.lk;

    # Cloudflare (SSL mode "Full") terminates the public certificate; this is
    # the origin certificate the *.tryso.lk stores already use.
    ssl_certificate     /www/server/panel/vhost/cert/tryso.lk/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/tryso.lk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    auth_basic "Harvey";
    auth_basic_user_file /www/server/panel/vhost/nginx/harvey.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    access_log /www/wwwlogs/harvey.tryso.lk.log;
    error_log  /www/wwwlogs/harvey.tryso.lk.error.log;
}
