# Continuous deploy to the VPS. Runs after the `tests` workflow passes on
# main (or by hand from the Actions tab). Copies the code over SSH, then
# deploy/remote-deploy.sh reinstalls and restarts the systemd service.
#
# Never touched on the VPS: .env, harvey.local.yaml, data/ (database,
# Gmail token), and the generated skills — those live only on the server.
#
# Required repo secrets:  VPS_SSH_KEY      private key whose .pub was given to bootstrap.sh
# Optional repo secrets:  VPS_KNOWN_HOSTS  output of `ssh-keyscan 161.97.118.140`
# Optional repo variables: VPS_HOST (default 161.97.118.140), VPS_USER (default harvey)
name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '161.97.118.140' }}
      VPS_USER: ${{ vars.VPS_USER || 'harvey' }}
      APP_DIR: /home/${{ vars.VPS_USER || 'harvey' }}/harvey
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Strip Windows line endings: a key pasted from Notepad fails with
          # "error in libcrypto".
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key. Paste the whole private key file (harvey_deploy, not the .pub), from -----BEGIN to -----END, with no passphrase. PuTTY .ppk keys don't work."
            exit 1
          fi
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set — trusting the host key on first use."
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Copy code
        run: |
          git rev-parse --short HEAD > .deployed-sha
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'tests/' \
            --exclude '.venv/' --exclude 'data/' --exclude '.env' \
            --exclude 'harvey.local.yaml' \
            --exclude 'skills/product_knowledge.md' --exclude 'skills/competitive_intel.md' \
            --exclude 'linkedin_cookies.json' --exclude '*.egg-info/' \
            ./ "vps:$APP_DIR/"

      - name: Install and restart
        run: ssh vps "bash $APP_DIR/deploy/remote-deploy.sh"
